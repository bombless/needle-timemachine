<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Needle Time Machine</title><style>:root{font:14px system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.app{max-width:1240px;margin:auto;padding:24px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #dde2eb;border-radius:12px;padding:16px;margin-top:16px;box-shadow:0 1px 2px #0001}button,input,textarea,select{font:inherit}button{padding:8px 12px;border:1px solid #cbd2df;border-radius:8px;background:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px}.field input,.field textarea,.field select{padding:8px;border:1px solid #cbd2df;border-radius:8px}.field textarea{min-height:80px}.muted{color:#697586}.timeline{position:relative;height:78px;overflow-x:auto;padding:12px 8px}.track{position:absolute;left:8px;right:8px;top:43px;height:3px;background:#ccd3df}.dot{position:absolute;top:36px;width:14px;height:14px;padding:0;border-radius:50%;border:2px solid #fff;background:#697586;box-shadow:0 0 0 1px #aeb7c5;transform:translateX(-50%)}.dot.layer{background:#3d63dd}.dot.current{background:#e05a33;transform:translateX(-50%) scale(1.25)}pre{white-space:pre-wrap;overflow:auto;max-height:320px;background:#f7f8fa;padding:12px;border-radius:8px}.kv{display:grid;grid-template-columns:120px 1fr;gap:7px;font:13px ui-monospace,monospace}.status{margin-top:10px;padding:10px;border-radius:8px;background:#f7f8fa;white-space:pre-wrap}.ok{background:#e9f7ef}.bad{background:#fff0f0}.warn{background:#fff8df}.metric{border:1px solid #dde2eb;border-radius:8px;padding:10px}.metric b{display:block;font-size:20px}.token-table,.probability-table{width:100%;border-collapse:collapse}.token-table td,.token-table th,.probability-table td,.probability-table th{padding:7px;border-bottom:1px solid #e5e9f0;text-align:left}.mono{font-family:ui-monospace,monospace}.probbar{height:8px;background:#e5e9f0;border-radius:4px;overflow:hidden}.fill{height:100%;background:#3d63dd}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="bar"><h1 style="margin:0">Needle Time Machine</h1><span id="summary" class="muted"></span></div><section class="card"><h2>载入权重并在浏览器完整前向校验</h2><p class="muted">完整参数由 trace_needle.py 接口传给浏览器；模型 forward 使用 jax-js 执行。</p><form id="verifyForm"><div class="bar"><label class="field"><span>Checkpoint (.pkl)</span><input id="checkpoint" name="checkpoint" type="file" accept=".pkl,application/octet-stream" required></label><label class="field" style="max-width:120px"><span>Trace level</span><select name="trace_level"><option value="layer" selected>layer</option><option value="op">op</option><option value="none">none</option></select></label><label class="field" style="max-width:100px"><span>Top-k</span><input name="top_k" type="number" min="1" value="5"></label></div><label class="field" style="margin-top:10px"><span>Prompt</span><textarea name="prompt" id="prompt">hello world</textarea></label><div class="bar" style="margin-top:10px"><button id="loadBtn" type="submit">载入权重并完整前向</button><span id="verifyStatus" class="status">尚未执行。</span></div></form></section><section class="card"><div class="bar"><button id="first">|&lt;</button><button id="prev">&lt;</button><button id="play">▶ Play</button><button id="next">&gt;</button><button id="last">&gt;|</button><label>速度 <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"><span id="speedText">1×</span></label></div><input id="slider" type="range" min="0" max="0" value="0" style="width:100%"><div class="timeline"><div class="track" id="track"></div></div></section><div class="grid"><section class="card"><h2 id="title">No event</h2><div id="details" class="kv"></div></section><section class="card"><h2>Tensor metadata</h2><pre id="tensors">{}</pre><h2>Event metadata</h2><pre id="metadata">{}</pre></section></div><section class="card"><h2>完整前向校验结果</h2><div class="bar"><div class="metric">layers<b id="layerCount">—</b></div><div class="metric">max |Δ|<b id="maxDiff">—</b></div><div class="metric">top-1 match<b id="topMatch">—</b></div></div><div id="forwardStatus" class="status">—</div></section><section class="card"><h2>Prompt tokens</h2><div id="promptTokens" class="muted">—</div></section><section class="card"><h2>Final token probabilities</h2><div id="probabilities" class="muted">—</div></section></main><script type="module" src="./ui.script.js"></script></body></html>
