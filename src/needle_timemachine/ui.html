<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Needle Time Machine</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #172033;
            background: #f5f7fb
        }

        body {
            margin: 0
        }

        .app {
            max-width: 1240px;
            margin: auto;
            padding: 24px
        }

        .bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .card {
            background: #fff;
            border: 1px solid #dde2eb;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 1px 2px #0001
        }

        button {
            font: inherit;
            padding: 8px 12px;
            border: 1px solid #cbd2df;
            border-radius: 8px;
            background: #fff;
            cursor: pointer
        }

        button:hover {
            background: #eef2f7
        }

        .muted {
            color: #697586
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .timeline {
            position: relative;
            height: 78px;
            overflow-x: auto;
            padding: 12px 8px
        }

        .track {
            position: absolute;
            left: 8px;
            right: 8px;
            top: 43px;
            height: 3px;
            background: #ccd3df
        }

        .dot {
            position: absolute;
            top: 36px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #697586;
            box-shadow: 0 0 0 1px #aeb7c5;
            transform: translateX(-50%)
        }

        .dot.layer {
            background: #3d63dd
        }

        .dot.current {
            background: #e05a33;
            transform: translateX(-50%) scale(1.25)
        }

        pre {
            white-space: pre-wrap;
            overflow: auto;
            max-height: 320px;
            background: #f7f8fa;
            padding: 12px;
            border-radius: 8px
        }

        .kv {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 7px;
            font-family: ui-monospace, monospace;
            font-size: 13px
        }

        .layer-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #f7f8fa
        }

        .ok {
            background: #e9f7ef
        }

        .bad {
            background: #fff0f0
        }

        .warn {
            background: #fff8df
        }

        .token-table {
            width: 100%;
            border-collapse: collapse
        }

        .token-table td,
        .token-table th {
            padding: 7px;
            border-bottom: 1px solid #e5e9f0;
            text-align: left
        }

        .mono {
            font-family: ui-monospace, monospace
        }

        .probability-table {
            width: 100%;
            border-collapse: collapse
        }

        .probability-table td,
        .probability-table th {
            padding: 8px;
            border-bottom: 1px solid #e5e9f0;
            text-align: left
        }

        .probbar {
            height: 8px;
            background: #e5e9f0;
            border-radius: 4px;
            overflow: hidden
        }

        .fill {
            height: 100%;
            background: #3d63dd
        }

        @media(max-width:760px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="bar">
            <h1 style="margin:0">Needle Time Machine</h1><span id="summary" class="muted"></span>
        </div>
        <div class="card">
            <div class="bar"><button id="first">|&lt;</button><button id="prev">&lt;</button><button id="play">▶
                    Play</button><button id="next">&gt;</button><button id="last">&gt;|</button><label>速度 <input
                        id="speed" type="range" min="0.25" max="4" step="0.25" value="1"><span
                        id="speedText">1×</span></label></div><input id="slider" type="range" min="0" max="0" value="0"
                style="width:100%">
            <div class="timeline">
                <div class="track" id="track"></div>
            </div>
        </div>
        <div class="grid">
            <section class="card">
                <h2 id="title">No event</h2>
                <div id="details" class="kv"></div>
            </section>
            <section class="card">
                <h2>Tensor metadata</h2>
                <pre id="tensors">{}</pre>
                <h2>Event metadata</h2>
                <pre id="metadata">{}</pre>
            </section>
        </div>
        <section class="card">
            <div class="layer-box">
                <div>
                    <h2 id="layerTitle" style="margin:0">Layer verification</h2>
                    <div class="muted">使用 jax-js 在浏览器重新构造输入/输出数组并计算指纹，同时检查相邻层的数值连续性。</div>
                </div><button id="verify" disabled>JAX.js 验算这一层</button>
            </div>
            <div id="verifyStatus" class="status">选择一个 layer 事件后可验算。</div>
        </section>
        <section class="card">
            <h2>Prompt tokens</h2>
            <div id="promptTokens" class="muted">—</div>
        </section>
        <section class="card">
            <h2>Final token probabilities</h2>
            <div id="probabilities" class="muted">—</div>
        </section>
    </main>
    <script type="module" src="./ui.script.js"></script>
</body>

</html>
